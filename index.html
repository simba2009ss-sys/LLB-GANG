<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проект</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0811; --ink:#eee9f8; --mut:#9a93ae; --line:rgba(255,255,255,.1);
  --acc:#b9a8ff; --acc-rgb:185,168,255;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --hdr:64px;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:transparent;color:var(--ink);font:400 16px/1.55 var(--body);min-height:100svh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none;-webkit-user-drag:none}
img{display:block;max-width:100%;-webkit-user-drag:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* зерно поверх всего */
body::after{content:"";position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* фон страницы: размытая обложка */
#amb{position:fixed;inset:-10%;z-index:-1;background-size:cover;background-position:center;transform:scale(1.15);
  filter:blur(80px) saturate(1.5);opacity:.26;transition:opacity .6s}
#amb:not(.img){opacity:1;filter:none;transform:none;inset:0;
  background:
   radial-gradient(60vmax 40vmax at 8% 0%,rgba(157,123,255,.22),transparent 60%),
   radial-gradient(50vmax 40vmax at 100% 30%,rgba(255,138,61,.14),transparent 60%),
   radial-gradient(50vmax 40vmax at 40% 100%,rgba(53,214,192,.12),transparent 60%)}

/* шапка */
#hdr{position:sticky;top:0;z-index:30;height:var(--hdr);display:flex;align-items:center;gap:14px;padding:0 24px;
  background:rgba(10,8,17,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);view-transition-name:hdr}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.25s var(--ease)}
.back:hover{border-color:var(--acc);color:var(--acc);transform:translateX(-3px)}
.back[hidden]{display:none}
.brand{font:800 15px/1 var(--display);letter-spacing:.02em}
.nav{margin-left:auto;display:flex;gap:6px}
.nav a{padding:8px 14px;border-radius:99px;color:var(--mut);font-size:14px;font-weight:500;transition:.25s}
.nav a:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.nav a.on{color:#0a0811;background:var(--acc)}
@media(max-width:620px){#hdr{padding:0 14px}.nav a{padding:8px 10px;font-size:13px}.brand{display:none}}

main{max-width:1240px;margin:0 auto;padding:0 24px 80px;min-height:70svh}
body.has-dock main{padding-bottom:130px}
@media(max-width:620px){main{padding:0 16px 80px}}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.05;letter-spacing:-.02em}
.mut{color:var(--mut)}
.who a{color:var(--acc)} .who a:hover{text-decoration:underline;text-underline-offset:3px}
.prod{color:var(--mut)} .prod a{color:var(--ink)} .prod a:hover{color:var(--acc)}
.chip{display:inline-block;padding:3px 12px;border:1px solid rgba(var(--acc-rgb),.5);color:var(--acc);border-radius:99px;font-size:13px;font-weight:500}

/* обложки */
.cover{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;display:flex;align-items:flex-end;padding:12px;
  font:800 18px/1.1 var(--display);box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s var(--ease),box-shadow .35s;will-change:transform}
.tilt::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 55%)}
.tilt:hover::after{opacity:1}
.tilt:hover{box-shadow:0 30px 60px -20px rgba(var(--acc-rgb),.35)}

/* ===== главная: панели артистов ===== */
.stage{padding-top:24px}
.panels{display:flex;gap:10px;height:clamp(460px,76svh,780px)}
.panel{position:relative;flex:1;border-radius:22px;overflow:hidden;display:flex;align-items:flex-end;isolation:isolate;
  background:linear-gradient(160deg,rgba(var(--a-rgb),.35),#0d0a16 70%);transition:flex .7s var(--ease)}
.panel::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--photo) center/cover;
  filter:grayscale(1) contrast(1.15) brightness(.62);transform:scale(1.06);transition:filter .6s,transform .9s var(--ease)}
.panel::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(0deg,rgba(8,6,14,.92) 0%,rgba(8,6,14,.35) 45%,transparent 75%)}
@media(hover:hover){
  .panels:hover .panel{flex:.78}
  .panels .panel:hover{flex:1.7}
  .panel:hover::before{filter:none;transform:scale(1)}
}
.panel-in{padding:clamp(18px,2.4vw,34px);width:100%}
.panel .role{font-size:14px;color:rgba(255,255,255,.75)}
.name-line{display:block;overflow:hidden;padding:.06em 0 .1em}
.panel .name{display:block;font:800 clamp(1.8rem,3.5vw,3.6rem)/1 var(--display);letter-spacing:-.03em;transition:color .3s}
.panel:hover .name{color:var(--a)}
.panel .tag{margin-top:8px;max-width:30ch;color:rgba(255,255,255,.78);font-size:15px}
.panel .count{margin-top:14px;display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:500;color:var(--a)}
.panel .count i{display:inline-block;width:26px;height:1px;background:currentColor;transition:width .5s var(--ease)}
.panel:hover .count i{width:60px}
@media(max-width:760px){
  .panels{flex-direction:column;height:auto}
  .panel{flex:none;min-height:38svh}
  .panel::before{filter:grayscale(.6) brightness(.7)}
}

/* ===== дорожка релизов (таймлайн) ===== */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:72px 0 22px}
.sec-head h2{font-size:clamp(1.5rem,3vw,2.2rem)}
.ctl{display:flex;gap:8px}
.ctl button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.25s var(--ease)}
.ctl button:hover{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.08)}
.rail{overflow-x:auto;cursor:grab;scrollbar-width:none;margin:0 -24px;padding:0 24px 8px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 70px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 70px),transparent)}
.rail::-webkit-scrollbar{display:none}
.rail.drag{cursor:grabbing}
.track-line{display:flex;gap:22px;width:max-content;position:relative}
.track-line::before{content:"";position:absolute;left:0;right:0;top:10px;height:1px;background:linear-gradient(90deg,var(--acc),var(--line) 25%)}
.rel{position:relative;width:176px;padding-top:46px;display:block}
.rel::before{content:"";position:absolute;top:6px;left:0;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--acc);transition:.3s var(--ease)}
.rel:hover::before{background:var(--acc);transform:scale(1.5)}
.rel .when{position:absolute;top:20px;left:0;font-size:13px;color:var(--mut)}
.rel .t{margin-top:12px;font-weight:600;line-height:1.25}
.rel .d{font-size:13px;color:var(--mut);margin-top:2px}
.yr{align-self:stretch;position:relative;width:46px;flex:none}
.yr span{position:absolute;top:46px;left:0;writing-mode:vertical-rl;transform:rotate(180deg);
  font:800 54px/1 var(--display);color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.28);letter-spacing:-.02em}

/* ===== страницы артиста / релиза / трека ===== */
.a-hero{display:grid;grid-template-columns:1fr minmax(220px,300px);gap:40px;align-items:end;padding-top:48px}
.a-hero h1{font-size:clamp(3rem,10.5vw,8.5rem);letter-spacing:-.045em;margin:14px 0 10px;overflow-wrap:anywhere}
.a-hero .bio{max-width:56ch;color:#cfc8de;font-size:18px}
.a-photo{aspect-ratio:3/4;border-radius:22px;background:var(--photo) center/cover;filter:grayscale(1) contrast(1.1);transition:filter .6s;box-shadow:0 30px 70px -30px rgba(var(--acc-rgb),.5)}
.a-photo:hover{filter:none}
@media(max-width:760px){.a-hero{grid-template-columns:1fr;gap:24px}.a-photo{order:-1;aspect-ratio:4/3;max-width:420px}}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:44px 0 8px}
.tab{padding:10px 18px;border-radius:99px;border:1px solid var(--line);color:var(--mut);font-weight:500;transition:.25s var(--ease)}
.tab:hover{color:var(--ink);border-color:rgba(255,255,255,.25)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#0a0811}
.yh{display:flex;align-items:baseline;gap:14px;margin:38px 0 16px}
.yh b{font:800 28px/1 var(--display);color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.4)}
.yh span{flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px}
.card .t{margin-top:12px;font-weight:600;line-height:1.25}
.card .d{font-size:13px;color:var(--mut)}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}}

.r-hero{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:clamp(24px,5vw,64px);align-items:end;padding-top:44px}
.r-hero h1{font-size:clamp(2rem,5.5vw,4.4rem);margin:16px 0 12px;overflow-wrap:anywhere}
.r-hero .credits{font-size:18px}
.r-hero .meta{margin-top:10px;color:var(--mut)}
.note{margin-top:8px;color:var(--mut);font-size:15px}.note a{color:var(--acc)}
@media(max-width:760px){.r-hero{grid-template-columns:1fr}.r-hero .art{max-width:340px}}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:13px 24px 13px 18px;border-radius:99px;background:var(--acc);color:#0a0811;font-weight:600;transition:.3s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px -12px rgba(var(--acc-rgb),.7)}
.btn[disabled]{background:transparent;color:var(--mut);border:1px dashed var(--line);cursor:default;transform:none;box-shadow:none}
.btn svg{width:18px;height:18px}
.btn .ic-pause,.btn.playing .ic-play{display:none}.btn.playing .ic-pause{display:block}

.plats{margin-top:24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pl-h{font-size:14px;color:var(--mut);margin-right:4px}
.plat{padding:7px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.28);font-size:14px;font-weight:500;transition:.25s var(--ease)}
.plat:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-2px)}
.plat.s{border-style:dashed;border-color:var(--line);color:var(--mut)}
.list{margin-top:34px}
.row{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:12px;padding:15px 12px;border-bottom:1px solid var(--line);
  transition:background .25s,padding .3s var(--ease)}
.row:first-child{border-top:1px solid var(--line)}
.row:hover{background:rgba(var(--acc-rgb),.08);padding-left:22px}
.row .n{color:var(--mut);font-variant-numeric:tabular-nums;transition:color .2s}
.row:hover .n{color:var(--acc)}
.row .tt{font-weight:500;font-size:17px}
.row .sub{font-size:13px;color:var(--mut)}
.row .du{color:var(--mut);font-variant-numeric:tabular-nums}
.eq{display:none;gap:3px;align-items:flex-end;height:16px}
.eq i{width:3px;background:var(--acc);height:30%;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{50%{height:100%}}
.row.now .n{color:var(--acc)} .row.now .tt{color:var(--acc)}
.row.now.playing .eq{display:flex}.row.now.playing .num{display:none}

.t-page{display:grid;grid-template-columns:minmax(240px,400px) 1fr;gap:clamp(28px,6vw,80px);padding-top:44px;align-items:start}
.t-art{position:sticky;top:calc(var(--hdr) + 28px)}
.t-page h1{font-size:clamp(1.9rem,4.4vw,3.4rem);margin:14px 0 12px;overflow-wrap:anywhere}
.t-page .credits{font-size:18px}
.t-page .meta{margin-top:8px;color:var(--mut);font-size:15px}.t-page .meta a{color:var(--ink);border-bottom:1px solid var(--line)}.t-page .meta a:hover{color:var(--acc)}
.lyrics{margin-top:48px;max-width:34em;font-size:clamp(1.05rem,1.6vw,1.25rem);line-height:1.8;color:#e4def0}
.lyrics .sec{display:block;margin:26px 0 8px;font-size:14px;font-weight:600;color:var(--acc)}
.lyrics .st{margin-bottom:22px}
.nolyr{margin-top:48px;padding:26px;border:1px dashed var(--line);border-radius:16px;color:var(--mut);max-width:34em}
@media(max-width:860px){.t-page{grid-template-columns:1fr}.t-art{position:static;max-width:340px}}
.empty{margin-top:30px;padding:34px;border:1px dashed var(--line);border-radius:18px;color:var(--mut);text-align:center}
footer{max-width:1240px;margin:0 auto;padding:30px 24px 50px;color:var(--mut);font-size:14px;display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line)}
footer a:hover{color:var(--acc)}

/* ===== плеер ===== */
.dock{position:fixed;left:50%;bottom:16px;z-index:40;width:min(980px,calc(100% - 24px));transform:translate(-50%,160%);transition:transform .6s var(--ease);
  display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1.3fr);align-items:center;gap:16px;padding:10px 18px 10px 10px;border-radius:20px;
  background:rgba(18,14,28,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);
  box-shadow:0 24px 60px -20px #000;view-transition-name:dock}
.dock.on{transform:translate(-50%,0)}
.d-cover{width:52px;height:52px;border-radius:12px;background-size:cover;background-position:center;background-color:#222}
.d-info{min-width:0;display:flex;flex-direction:column}
.d-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.d-title:hover{color:var(--acc)}
.d-who{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-ctl{display:flex;align-items:center;gap:4px}
.d-ctl button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:.2s}
.d-ctl button:hover{background:rgba(255,255,255,.1)}
.d-ctl .d-play{background:var(--acc);color:#0a0811;width:46px;height:46px}.d-ctl .d-play:hover{background:var(--acc);transform:scale(1.07)}
.d-play .ic-pause,.d-play.playing .ic-play{display:none}.d-play.playing .ic-pause{display:block}
.d-prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.bar{flex:1;height:18px;display:flex;align-items:center;cursor:pointer}
.bar::before{content:"";flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.15);box-shadow:inset 0 0 0 0 var(--acc)}
.bar{position:relative}
.bar i{position:absolute;left:0;top:7px;height:4px;border-radius:4px;background:var(--acc);width:0}
@media(max-width:700px){.dock{grid-template-columns:auto 1fr auto;gap:10px}.d-prog{display:none}.d-ctl button:not(.d-play){display:none}}

/* ===== анимации ===== */
::view-transition-old(root),::view-transition-new(root){animation-duration:.4s}
::view-transition-group(cover){animation-duration:.55s;animation-timing-function:var(--ease)}
.intro .panel{animation:panelIn 1s var(--ease) both;animation-delay:calc(var(--i)*.13s)}
.intro .name{animation:rise .9s var(--ease) both;animation-delay:calc(.4s + var(--i)*.13s)}
.intro .role,.intro .tag,.intro .count{animation:fade .8s ease both;animation-delay:calc(.8s + var(--i)*.13s)}
@keyframes panelIn{from{clip-path:inset(100% 0 0 0 round 22px)}to{clip-path:inset(0 round 22px)}}
@keyframes rise{from{transform:translateY(115%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tilt{transform:none!important}
}

/* ===== Дополнительная плавность интерфейса ===== */
html { scroll-behavior:smooth; }
@media (hover:hover) and (pointer:fine) {
  .card, .rel { transition:transform .48s var(--ease); }
  .card:hover, .rel:hover { transform:translateY(-7px); }
  .cover { transition:box-shadow .5s var(--ease), border-radius .5s var(--ease); }
  .cover img { transition:scale .85s var(--ease); }
  .card:hover .cover img, .rel:hover .cover img { scale:1.065; }
  .card:hover .cover, .rel:hover .cover { box-shadow:0 26px 60px -20px rgba(var(--acc-rgb),.33); }
  .panel .panel-in { transition:transform .65s var(--ease); }
  .panel:hover .panel-in { transform:translateY(-8px); }
  .tab, .plat, .nav a, .ctl button, .back { transition-duration:.36s; transition-timing-function:var(--ease); }
  .tab:hover, .nav a:not(.on):hover { transform:translateY(-2px); }
  .row { transition:background .35s var(--ease), padding .45s var(--ease); }
}
@keyframes softPageIn {
  from { opacity:0; transform:translateY(18px); filter:blur(5px); }
  to { opacity:1; transform:translateY(0); filter:blur(0); }
}
@keyframes softHeaderIn {
  from { opacity:0; transform:translateY(-12px); }
  to { opacity:1; transform:translateY(0); }
}
@media (prefers-reduced-motion:no-preference) {
  #hdr { animation:softHeaderIn .72s var(--ease) both; }
  ::view-transition-old(root) { animation-duration:.3s; animation-timing-function:ease-in; }
  ::view-transition-new(root) { animation-duration:.55s; animation-timing-function:var(--ease); }
  ::view-transition-group(cover) { animation-duration:.7s; animation-timing-function:var(--ease); }
  .dock { transition:transform .75s var(--ease), box-shadow .4s var(--ease); }
  .dock.on { box-shadow:0 25px 80px -22px rgba(var(--acc-rgb),.24); }
}
@media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }


/* ===== CINEMATIC MOTION V2 ===== */
@keyframes cinemaPanel {
  0% { opacity:0; transform:translate3d(0,85px,0) scale(.93); filter:blur(12px) brightness(.7); }
  60% { opacity:1; filter:blur(0) brightness(1); }
  100% { opacity:1; transform:translate3d(0,0,0) scale(1); filter:blur(0) brightness(1); }
}
@keyframes cinemaText {
  0% { opacity:0; transform:translate3d(0,38px,0); filter:blur(8px); }
  100% { opacity:1; transform:none; filter:blur(0); }
}
@keyframes cinemaReveal {
  0% { opacity:0; transform:translate3d(0,42px,0) scale(.96); filter:blur(7px); }
  100% { opacity:1; transform:translate3d(0,0,0) scale(1); filter:blur(0); }
}
@keyframes cinemaGlow {
  0%,100% { opacity:.55; transform:translate3d(-2%,0,0) scale(1); }
  50% { opacity:1; transform:translate3d(2%,-2%,0) scale(1.07); }
}
@keyframes cinemaLine { from { transform:scaleX(0); opacity:0 } to { transform:scaleX(1); opacity:1 } }
/* Animate the actual home hero on EVERY visit, including refresh. */
@media (prefers-reduced-motion:no-preference) {
  #amb:not(.img) { animation:cinemaGlow 14s ease-in-out infinite alternate; transform-origin:center; }
  #app.cinematic .panel { animation:cinemaPanel 1.05s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--i, 0) * 140ms + 40ms); }
  #app.cinematic .panel .name { animation:cinemaText .85s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--i, 0) * 140ms + 350ms); }
  #app.cinematic .panel .role, #app.cinematic .panel .count { animation:cinemaText .8s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--i, 0) * 140ms + 500ms); }
  #app.cinematic .a-hero > *, #app.cinematic .r-hero > *, #app.cinematic .t-page > * { animation:cinemaReveal .85s cubic-bezier(.16,1,.3,1) both; }
  #app.cinematic .a-hero > :nth-child(2), #app.cinematic .r-hero > :nth-child(2), #app.cinematic .t-page > :nth-child(2) { animation-delay:120ms; }
  #app .fx-in { animation:cinemaReveal .8s cubic-bezier(.16,1,.3,1) both; animation-delay:var(--fx-delay,0ms); }
  #app .sec-head h2 { text-wrap:balance; }

  .panel-in { position:relative; z-index:1; }
  .panel-in::before { content:""; position:absolute; width:140px; height:2px; left:clamp(18px,2.4vw,34px); bottom:15px; transform:scaleX(0); transform-origin:left; background:var(--a); box-shadow:0 0 20px var(--a); transition:transform .65s cubic-bezier(.16,1,.3,1); }

  .cover { isolation:isolate; }
  .cover::before { content:"";position:absolute;z-index:2;inset:-80%;pointer-events:none; background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.20) 50%,transparent 58%); transform:translateX(-85%) rotate(10deg); transition:transform .95s cubic-bezier(.16,1,.3,1); }
  .card:hover .cover::before,.rel:hover .cover::before { transform:translateX(85%) rotate(10deg); }
  .tab:active,.btn:active,.ctl button:active { transform:scale(.95); }
  @media (hover:hover) and (pointer:fine){
    .card,.rel { transition:transform .6s cubic-bezier(.16,1,.3,1); }
    .card:hover,.rel:hover { transform:translateY(-10px); }
    .cover img { transition:transform 1s cubic-bezier(.16,1,.3,1); }
    .card:hover .cover img,.rel:hover .cover img { transform:scale(1.08); }
  }
}
@media(prefers-reduced-motion:reduce){

}

function platLinks(direct,query,search){

function lyricsHtml(text){
  if(!text||!text.trim()) return `<div class="nolyr">Текста пока нет</div>`;
  const out=[]; let st=[];
  const flush=()=>{ if(st.length){ out.push(`<div class="st">${st.join("<br>")}</div>`); st=[]; } };
  text.replace(/\r/g,"").split("\n").forEach(line=>{
    const l=line.trim();
    if(!l){ flush(); return; }
    if(/^\[.+\]$/.test(l)){ flush(); out.push(`<span class="sec">${esc(l.slice(1,-1))}</span>`); return; }
    st.push(esc(line));
  });
  flush();
  return `<div class="lyrics">${out.join("")}</div>`;
}

  const L=window.LYRICS||{};
  const base=t.same?tById(t.same):null;
  const ly=L[t.id]||(base&&L[base.id])||t.lyrics||(base&&base.lyrics)||"";
  const aud=trackAudio(t);
  const dur=t.dur||(base&&base.dur)||"";
  const sg=TRACKS.filter(x=>x.same===t.id).map(x=>`<a href="#/track/${x.id}">${esc(rById(x.release).title)}</a>`);
  const notes=(base?`<p class="note">Есть в альбоме <a href="#/release/${base.release}">${esc(rById(base.release).title)}</a></p>`:"")
             +(sg.length?`<p class="note">Выходил отдельным синглом: ${sg.join(", ")}</p>`:"");
  const single=r.type==="single";
  return {
    title:t.title, parent: single?"#/artist/"+r.artist+(r.official?"":"/unofficial"):"#/release/"+r.id, accent:accOf(r.artist), amb:r.cover||null,
    html:`<section class="t-page"><div class="t-art">${cover(r,{named:true})}</div>
      <div><span class="chip">${TYPE[r.type]}${r.official?"":" · неофициальный"}</span>
        <h1>${esc(t.title)}</h1>
        <p class="credits">${credits(trackArtists(t))}${prod(r)}</p>
        <p class="meta">${single?"":`Из альбома <a href="#/release/${r.id}">${esc(r.title)}</a> · `}${fmt(r.date)}${dur?" · "+esc(dur):""}</p>
        ${notes}
        <button class="btn" data-play="${t.id}" ${aud?"":"disabled"}>${ICON_PLAY}${aud?"Слушать":"Аудио скоро"}</button>
        ${platLinks(trackLinks(t),names([r.artist])+" "+cleanQ(t.title),r.official)}
        ${lyricsHtml(ly)}
      </div></section>`
  };
}

function beatPage(id){
  const b=bById(id); if(!b) return notFound();
  const fake={artist:"someone",title:b.title};
  return {
    title:b.title, parent:"#/artist/someone/beats", accent:accOf("someone"), amb:null,
    html:`<section class="t-page"><div class="t-art">${cover(fake)}</div><div>
      <span class="chip">Бит</span><h1>${esc(b.title)}</h1>
      <p class="credits">${credits(["someone"])}</p>
      <p class="meta">${b.bpm} BPM · ${esc(b.key)} · ${esc(b.note)} · ${esc(b.dur)}</p>
      ${b.audio?`<audio controls src="${esc(b.audio)}" style="margin-top:22px;width:100%"></audio>`:`<button class="btn" disabled>${ICON_PLAY}Аудио скоро</button>`}
      ${b.price?`<p class="note">Цена: ${esc(b.price)}</p>`:""}
    </div></section>`
  };
}
function notFound(){
  return {title:"Не найдено",parent:"#/",accent:DEFAULT_ACC,amb:null,
    html:`<section style="padding-top:80px"><h1 style="font-size:clamp(2rem,6vw,4rem)">Такой страницы нет</h1><p class="mut" style="margin-top:14px">Возможно, ссылка устарела. <a href="#/" style="color:var(--acc)">Вернуться на главную</a></p></section>`};
}


// Заметные анимации блоков при прокрутке; контент остаётся доступным даже без JS.
let entranceObserver=null;
function animateView(){
  if(entranceObserver){ entranceObserver.disconnect(); entranceObserver=null; }
  if(reduce) return;
  // Герой анимируется собственным каскадом; остальное — по мере появления.
  const items=[...app.querySelectorAll('.sec-head, .rail .rel, .tabs, .yh, .grid .card, .list .row, .empty, .lyrics .st, .lyrics .sec, .nolyr')];
  function play(el,index){
    if(el.classList.contains('fx-in')) return;
    const offset=el.matches('.rel,.card,.row') ? (index%6)*85 : 0;
    el.style.setProperty('--fx-delay',offset+'ms');
    el.classList.add('fx-in');
  }
  if(!('IntersectionObserver' in window)) { items.forEach(play); return; }
  entranceObserver=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entranceObserver.unobserve(entry.target);
        play(entry.target,items.indexOf(entry.target));
      }
    });
  },{rootMargin:'0px 0px -20px 0px',threshold:.04});
  items.forEach(el=>entranceObserver.observe(el));
}

// ---------- роутер, переходы, «назад» ----------
let parentHash="#/", firstPaint=true;
let stack=[location.hash||"#/"];

function route(){
  let p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  if(p[0]==="release"){
    const r=rById(p[1]);
    if(r&&r.type==="single"){
      const ts=TRACKS.filter(t=>t.release===r.id);
      if(ts.length===1){ p=["track",ts[0].id]; const h="#/track/"+ts[0].id; history.replaceState(null,"",h); stack[stack.length-1]=h; }
    }
  }
  if(!p.length) return home();
  if(p[0]==="artist") return artistPage(p[1],p[2]);
  if(p[0]==="release") return releasePage(p[1]);
  if(p[0]==="track") return trackPage(p[1]);
  if(p[0]==="beat") return beatPage(p[1]);
  return notFound();
}
function commit(v){
  parentHash=v.parent||"#/";
  setAccent(v.accent||DEFAULT_ACC); setAmbient(v.amb||null);
  document.title=v.title?`${v.title} — ${SITE_NAME}`:SITE_NAME;
  app.innerHTML=v.html;
  app.classList.remove("intro","cinematic");
  // Force a fresh cinematic intro on every SPA navigation, not just the first page.
  void app.offsetWidth;
  app.classList.add("cinematic");
  $("#back").hidden=(location.hash===""||location.hash==="#/");
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.nav===v.nav));
  window.scrollTo(0,0);
  if(v.after) v.after();
  syncUI();
  animateView();
}
function go(){
  const run=()=>commit(route());
  if(!firstPaint&&document.startViewTransition&&!reduce){
    const vt=document.startViewTransition(run);
    vt.ready.catch(()=>{}); vt.finished.catch(()=>{});
  } else run();
  firstPaint=false;
}
window.addEventListener("hashchange",()=>{
  const h=location.hash||"#/";
  if(stack.length>1&&stack[stack.length-2]===h) stack.pop(); else stack.push(h);
  go();
});
$("#back").onclick=()=>{ if(stack.length>1) history.back(); else location.hash=parentHash; };

// клик по обложке: она «перелетает» на следующую страницу
document.addEventListener("click",e=>{
  if(drag.moved>5){ e.preventDefault(); e.stopPropagation(); drag.moved=0; return; }
  const a=e.target.closest&&e.target.closest("a"); if(!a) return;
  const c=a.querySelector(".cover[data-vt]"); if(c) c.style.viewTransitionName="cover";
},true);

// ---------- перетаскивание дорожки мышью ----------
const drag={el:null,sx:0,sl:0,moved:0};
document.addEventListener("mousedown",e=>{
  const rail=e.target.closest&&e.target.closest(".rail"); if(!rail||e.button!==0) return;
  drag.el=rail; drag.sx=e.clientX; drag.sl=rail.scrollLeft; drag.moved=0;
});
window.addEventListener("mousemove",e=>{
  if(!drag.el) return;
  const dx=e.clientX-drag.sx; drag.moved=Math.max(drag.moved,Math.abs(dx));
  if(drag.moved>5){ drag.el.classList.add("drag"); drag.el.scrollLeft=drag.sl-dx; }
});
window.addEventListener("mouseup",()=>{ if(drag.el){ drag.el.classList.remove("drag"); drag.el=null; setTimeout(()=>{drag.moved=0},0); } });

// ---------- наклон обложек ----------
if(matchMedia("(hover:hover)").matches&&!reduce){
  let last=null;
  const reset=el=>{ if(el){ el.style.setProperty("--rx","0deg"); el.style.setProperty("--ry","0deg"); } };
  document.addEventListener("pointermove",e=>{
    const el=e.target.closest&&e.target.closest(".tilt");
    if(el!==last){ reset(last); last=el; }
    if(!el) return;
    const b=el.getBoundingClientRect(), x=(e.clientX-b.left)/b.width, y=(e.clientY-b.top)/b.height;
    el.style.setProperty("--ry",((x-.5)*14).toFixed(2)+"deg");
    el.style.setProperty("--rx",((.5-y)*14).toFixed(2)+"deg");
    el.style.setProperty("--mx",(x*100).toFixed(1)+"%");
    el.style.setProperty("--my",(y*100).toFixed(1)+"%");
  });
}

// ---------- плеер ----------
const audio=new Audio(); audio.preload="none";
let cur=null, queue=[], qi=-1;
const dock=$("#dock");
function showDock(t){
  const r=rById(t.release);
  $("#dTitle").textContent=t.title; $("#dTitle").href="#/track/"+t.id;
  $("#dWho").textContent=names(trackArtists(t));
  const c=$("#dCover"); c.href="#/track/"+t.id;
  c.style.backgroundImage=r.cover?`url('${r.cover}')`:grad(relHue(r)); if(!r.cover) c.style.background=grad(relHue(r));
  dock.classList.add("on"); document.body.classList.add("has-dock");
}
function loadTrack(t){ cur=t; audio.src=trackAudio(t); audio.play().catch(()=>{}); showDock(t); syncUI(); }
function playTrack(id){
  const t=tById(id); if(!t||!trackAudio(t)) return;
  if(cur&&cur.id===id){ audio.paused?audio.play():audio.pause(); return; }
  queue=TRACKS.filter(x=>x.release===t.release).sort((a,b)=>a.n-b.n).filter(trackAudio);
  qi=queue.findIndex(x=>x.id===id); loadTrack(t);
}
function step(d){ const n=qi+d; if(n>=0&&n<queue.length){ qi=n; loadTrack(queue[n]); } }
document.addEventListener("click",e=>{
  const p=e.target.closest&&e.target.closest("[data-play]");
  if(p){ e.preventDefault(); playTrack(p.dataset.play); return; }
  const pr=e.target.closest&&e.target.closest("[data-playrel]");
  if(pr&&!pr.disabled){
    e.preventDefault();
    const rid=pr.dataset.playrel;
    if(cur&&cur.release===rid){ audio.paused?audio.play():audio.pause(); }
    else { const f=TRACKS.filter(x=>x.release===rid).sort((a,b)=>a.n-b.n).find(trackAudio); if(f) playTrack(f.id); }
  }
});
$("#dPlay").onclick=()=>{ if(cur) audio.paused?audio.play():audio.pause(); };
$("#dPrev").onclick=()=>{ if(audio.currentTime>3) audio.currentTime=0; else step(-1); };
$("#dNext").onclick=()=>step(1);
$("#dBar").addEventListener("click",e=>{
  const b=e.currentTarget.getBoundingClientRect();
  if(audio.duration) audio.currentTime=audio.duration*Math.min(1,Math.max(0,(e.clientX-b.left)/b.width));
});
audio.addEventListener("timeupdate",()=>{
  $("#dCur").textContent=mmss(audio.currentTime); $("#dTot").textContent=mmss(audio.duration);
  $("#dFill").style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+"%";
});
audio.addEventListener("play",syncUI); audio.addEventListener("pause",syncUI);
audio.addEventListener("ended",()=>{ if(qi<queue.length-1) step(1); else syncUI(); });
function syncUI(){
  const playing=!!cur&&!audio.paused;
  $("#dPlay").classList.toggle("playing",playing);
  document.querySelectorAll("[data-play]").forEach(b=>b.classList.toggle("playing",playing&&cur&&b.dataset.play===cur.id));
  document.querySelectorAll("[data-playrel]").forEach(b=>b.classList.toggle("playing",playing&&cur&&b.dataset.playrel===cur.release));
  document.querySelectorAll(".row[data-tid]").forEach(r=>{
    const on=!!cur&&r.dataset.tid===cur.id; r.classList.toggle("now",on); r.classList.toggle("playing",on&&playing);
  });
}

go();
</script>
